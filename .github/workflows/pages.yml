name: deploy to github pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/entries.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the picker before shipping it
        run: node web/test_picker.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          # data/entries.json is gitignored until you commit a real one.
          if [ -f data/entries.json ]; then
            cp data/entries.json _site/entries.json
            echo "shipped $(python3 -c "import json;print(len(json.load(open('data/entries.json'))['entries']))") entries"
          else
            echo "::warning::No data/entries.json - the site will run on placeholder data"
          fi
          rm -f _site/test_picker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
