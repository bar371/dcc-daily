name: test

on:
  push:
  pull_request:

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser fixture tests
        run: python3 tools/test_parse.py
      - name: Fetcher tests (mocked API)
        run: python3 tools/test_fetch.py
      - name: books.json is valid
        run: python3 -c "import json; json.load(open('config/books.json'))"
