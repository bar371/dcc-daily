name: refresh dataset

# Monthly, plus on demand. Opens a PR when the wiki has changed, so the diff
# gets a human read before it reaches the app - which doubles as spoiler review.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 tools/fetch_wiki.py
      - run: python3 tools/build_dataset.py --report | tee report.txt

      - name: Open PR if the dataset moved
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/entries.json
          branch: chore/dataset-refresh
          title: "Dataset refresh"
          commit-message: "chore: refresh dataset from wiki"
          body-path: report.txt
